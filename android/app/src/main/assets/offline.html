<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — My Conference Companion</title>
    <style>
      :root {
        --navy: #123e73;
        --navy-deep: #08284e;
        --gold: #c9a227;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          "Plus Jakarta Sans",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: #fff;
        background: linear-gradient(135deg, var(--navy), var(--navy-deep));
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .rule {
        width: 64px;
        height: 4px;
        background: var(--gold);
        border-radius: 2px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.9rem;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.78);
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        border: 0;
        border-radius: 10px;
        color: var(--navy-deep);
        background: var(--gold);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="rule"></div>
      <h1>You're offline</h1>
      <p>
        My Conference Companion needs a connection to load schedules, maps and messages. Reconnect
        and try again — anything you had open will still be there.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
