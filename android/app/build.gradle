plugins {
    id 'com.android.application'
}

// The Play *upload* key. Google Play re-signs the bundle with the app signing
// key it holds, so this file only needs to exist when producing a release
// build. It is git-ignored on purpose - see android/README.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // Permanent, Play-wide unique identifier. This must match the package_name
    // in public/.well-known/assetlinks.json, and it can never be changed after
    // the first upload to Play.
    namespace 'com.orivonedge.conferencecompanion'
    compileSdk 36

    defaultConfig {
        applicationId 'com.orivonedge.conferencecompanion'
        minSdk 23

        // Google Play requires new apps to target API 36 from 31 Aug 2026.
        targetSdk 36
        versionCode 17
        versionName '1.0.16'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Provides LauncherActivity, DelegationService and the Custom Tabs plumbing
    // that make a Trusted Web Activity work (kept for the legacy rollback
    // activity in the manifest).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    // WebViewAssetLoader: serves the bundled SPA from assets/ under an
    // https://appassets.androidplatform.net origin inside FullOfflineActivity.
    // Google Play In-App Updates (OTA updates inside the app): powers the
    // flexible/immediate update sheets wired up in InAppUpdateManager.
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
